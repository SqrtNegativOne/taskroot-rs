<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      // Keep WebView2 active and mitigate timer throttling when windows are inactive.
      if ('locks' in navigator) {
        navigator.locks.request('taskroot-keep-awake', { mode: 'shared' }, () => new Promise(() => {}));
      }

      function isChunkError(error) {
        const msg = String(error?.message || error || '');
        return (
          msg.includes('Failed to fetch dynamically imported module') ||
          msg.includes('error loading dynamically imported module') ||
          msg.includes('Importing a module script failed')
        );
      }

      function attemptChunkRecovery() {
        const key = 'taskroot_chunk_reload_ts';
        const last = parseInt(sessionStorage.getItem(key) || '0', 10);
        const now = Date.now();
        // Prevent infinite reload loops if a module is genuinely missing or broken.
        if (now - last > 5000) {
          sessionStorage.setItem(key, String(now));
          setTimeout(() => {
            window.location.reload();
          }, 500);
          return true;
        }
        return false;
      }

      window.addEventListener('vite:preloadError', (event) => {
        event.preventDefault();
        attemptChunkRecovery();
      });

      window.addEventListener('unhandledrejection', (event) => {
        if (isChunkError(event.reason)) {
          event.preventDefault();
          attemptChunkRecovery();
          return;
        }
        console.error('Unhandled promise rejection:', event.reason);
      });

      window.addEventListener('error', (event) => {
        if (isChunkError(event.error || event.message)) {
          event.preventDefault();
          attemptChunkRecovery();
          return;
        }
        console.error('Global runtime error:', event.error || event.message);
      });
    </script>
  </body>
</html>
