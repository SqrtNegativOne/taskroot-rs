[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
# `cargo run` has two binaries to choose from; the GUI is the default, the
# headless CLI stays available through `cargo run --bin taskroot`.
default-run = "tauri-app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
serde = "1"
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
taskroot-macros = { path = "./taskroot-macros" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.16"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json"] }
tauri-plugin-store = "2.4.4"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
tauri-plugin-deep-link = "2"
rrule = "0.14.0"
chrono-tz = "0.10"
serde_repr = "0.1.21"
color-eyre = "0.6.5"
icalendar = "0.17"
roxmltree = "0.21"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# Deny panics
unwrap_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[dev-dependencies]
proptest = "1.6.0"
wiremock = "0.6"
