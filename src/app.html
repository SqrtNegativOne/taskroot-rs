<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script>
      window.addEventListener('error', (event) => {
        const msg = "GLOBAL RUNTIME ERROR:\n" + event.message + "\n\n" + event.filename + ":" + event.lineno + ":" + event.colno + "\n\n" + (event.error && event.error.stack ? event.error.stack : '');
        const errorDiv = document.createElement('div');
        errorDiv.style = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: red; color: white; z-index: 999999; padding: 20px; font-family: monospace; white-space: pre-wrap; overflow: auto;";
        errorDiv.innerText = msg;
        document.body.appendChild(errorDiv);
      });
      window.addEventListener('unhandledrejection', (event) => {
        const msg = "UNHANDLED PROMISE REJECTION:\n" + (event.reason && event.reason.stack ? event.reason.stack : String(event.reason));
        const errorDiv = document.createElement('div');
        errorDiv.style = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: darkred; color: white; z-index: 999999; padding: 20px; font-family: monospace; white-space: pre-wrap; overflow: auto;";
        errorDiv.innerText = msg;
        document.body.appendChild(errorDiv);
      });
    </script>
  </body>
</html>
